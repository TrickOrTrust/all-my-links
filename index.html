<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlintGames</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f10;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 16, .96);
      border-bottom: 1px solid #29292d;
      padding: 18px 24px;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: #ff4d6d;
    }

    .zoekbalk {
      width: min(520px, 100%);
      position: relative;
    }

    .zoekbalk input {
      width: 100%;
      height: 48px;
      border: 0;
      outline: none;
      border-radius: 14px;
      padding: 0 18px 0 48px;
      background: #242428;
      color: #fff;
      font-size: 16px;
      border: 1px solid #303035;
    }

    .zoekbalk input:focus {
      border-color: #55555d;
    }

    .zoek-icoon {
      position: absolute;
      left: 17px;
      top: 13px;
      font-size: 20px;
      opacity: .7;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 50px;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .intro h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .intro p {
      margin: 0;
      color: #9999a3;
    }

    #aantal {
      color: #9999a3;
      font-size: 14px;
      white-space: nowrap;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .game {
      border: 0;
      padding: 0;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
      min-width: 0;
    }

    .kaart {
      background: #1c1c20;
      border: 1px solid #29292e;
      border-radius: 16px;
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .game:hover .kaart {
      transform: translateY(-5px);
      border-color: #45454d;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .game-afbeelding {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #29292e;
    }

    .game-info {
      padding: 13px 14px 15px;
    }

    .game-naam {
      display: block;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .geen-resultaat {
      display: none;
      text-align: center;
      padding: 70px 20px;
      color: #9999a3;
    }

    .geen-resultaat strong {
      display: block;
      color: white;
      font-size: 21px;
      margin-bottom: 7px;
    }

    /* Waarschuwingsvenster */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 20px;
      background: rgba(0,0,0,.78);
      justify-content: center;
      align-items: center;
    }

    .popup {
      width: 100%;
      max-width: 430px;
      background: #202024;
      border: 1px solid #38383f;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,.65);
      animation: popupIn .16s ease-out;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: scale(.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .popup-afbeelding {
      width: 110px;
      height: 75px;
      object-fit: cover;
      border-radius: 13px;
      margin-bottom: 13px;
      background: #2a2a2f;
    }

    .popup h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .popup p {
      margin: 0;
      color: #b6b6bf;
      line-height: 1.5;
    }

    .knoppen {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .knoppen button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .annuleer {
      background: #38383d;
      color: #fff;
    }

    .doorgaan {
      background: #ff4d6d;
      color: #fff;
    }

    .annuleer:hover {
      background: #46464c;
    }

    .doorgaan:hover {
      background: #ff6682;
    }

    @media (max-width: 700px) {
      header {
        padding: 14px 15px;
      }

      .topbar {
        display: block;
      }

      .logo {
        margin-bottom: 13px;
      }

      main {
        padding: 22px 15px 40px;
      }

      .games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .intro h1 {
        font-size: 25px;
      }

      .intro {
        align-items: center;
      }
    }

    @media (max-width: 390px) {
      .games {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="topbar">
        <div class="logo">Flint<span>Games</span></div>

        <div class="zoekbalk">
          <span class="zoek-icoon">⌕</span>
          <input
            id="zoekveld"
            type="search"
            placeholder="Zoek een game..."
            autocomplete="off"
          >
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="intro">
      <div>
        <h1>Alle games</h1>
        <p>Kies een game om hem te openen.</p>
      </div>

      <div id="aantal"></div>
    </div>

    <div class="games" id="gamesContainer"></div>

    <div class="geen-resultaat" id="geenResultaat">
      <strong>Geen games gevonden</strong>
      Probeer een andere zoekterm.
    </div>
  </main>

  <!-- WAARSCHUWING -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <img id="popupAfbeelding" class="popup-afbeelding" src="" alt="">

      <h2 id="popupTitel">⚠️ Waarschuwing</h2>

      <p>
        Je staat op het punt om een externe website te openen.
        Weet je zeker dat je wilt doorgaan?
      </p>

      <div class="knoppen">
        <button class="annuleer" onclick="sluitPopup()">
          Annuleren
        </button>

        <button class="doorgaan" onclick="gaDoor()">
          Doorgaan
        </button>
      </div>
    </div>
  </div>

    // =================================================
    // HIERONDER HOEF JE NIKS AAN TE PASSEN
    // =================================================

    const container = document.getElementById("gamesContainer");
    const overlay = document.getElementById("overlay");
    const popupTitel = document.getElementById("popupTitel");
    const popupAfbeelding = document.getElementById("popupAfbeelding");
    const zoekveld = document.getElementById("zoekveld");
    const aantal = document.getElementById("aantal");
    const geenResultaat = document.getElementById("geenResultaat");

    let gekozenLink = "";

    // Fisher-Yates shuffle:
    // hierdoor staan de games bij iedere pagina-lading in een andere volgorde.
    function schud(array) {
      const kopie = [...array];

      for (let i = kopie.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
      }

      return kopie;
    }

    const willekeurigeLinks = schud(links);

    function toonGames(lijst) {
      container.innerHTML = "";

      aantal.textContent =
        lijst.length + (lijst.length === 1 ? " game" : " games");

      if (lijst.length === 0) {
        geenResultaat.style.display = "block";
        return;
      }

      geenResultaat.style.display = "none";

      lijst.forEach((link) => {
        const knop = document.createElement("button");
        knop.className = "game";

        knop.innerHTML = `
          <div class="kaart">
            <img
              class="game-afbeelding"
              src="${link.afbeelding}"
              alt=""
              loading="lazy"
              onerror="this.style.visibility='hidden'"
            >
            <div class="game-info">
              <span class="game-naam">${link.naam}</span>
            </div>
          </div>
        `;

        knop.onclick = function() {
          gekozenLink = link.url;
          popupTitel.textContent = "⚠️ " + link.naam;
          popupAfbeelding.src = link.afbeelding;
          popupAfbeelding.alt = link.naam;
          overlay.style.display = "flex";
        };

        container.appendChild(knop);
      });
    }

    function sluitPopup() {
      overlay.style.display = "none";
      gekozenLink = "";
    }

    function gaDoor() {
      if (gekozenLink) {
        window.location.href = gekozenLink;
      }
    }

    // Zoeken
    zoekveld.addEventListener("input", function() {
      const zoekterm = this.value.trim().toLowerCase();

      const resultaten = willekeurigeLinks.filter((link) =>
        link.naam.toLowerCase().includes(zoekterm)
      );

      toonGames(resultaten);
    });

    // Escape sluit de waarschuwing
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        sluitPopup();
      }
    });

    // Klik buiten de popup = sluiten
    overlay.addEventListener("click", function(event) {
      if (event.target === overlay) {
        sluitPopup();
      }
    });

    // Startpagina
    toonGames(willekeurigeLinks);
  </script>
