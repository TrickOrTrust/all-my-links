<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlintGames</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f10;
      color: #fff;
    }

    body {
      overflow-x: hidden;
    }

    /* ==============================
       HEADER
    ============================== */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 16, 0.96);
      border-bottom: 1px solid #29292d;
      backdrop-filter: blur(14px);
    }

    .header-inner {
      max-width: 1250px;
      margin: 0 auto;
      padding: 16px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 31px;
      font-weight: 900;
      letter-spacing: -1.6px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .logo span {
      color: #ff4d6d;
    }

    .zoekbalk {
      width: min(520px, 100%);
      position: relative;
    }

    .zoekbalk input {
      width: 100%;
      height: 48px;
      border: 1px solid #303035;
      outline: none;
      border-radius: 14px;
      padding: 0 18px 0 48px;
      background: #242428;
      color: white;
      font-size: 16px;
      transition: .15s ease;
    }

    .zoekbalk input::placeholder {
      color: #8d8d96;
    }

    .zoekbalk input:focus {
      border-color: #55555d;
      background: #29292e;
    }

    .zoek-icoon {
      position: absolute;
      left: 17px;
      top: 11px;
      font-size: 22px;
      opacity: .7;
      pointer-events: none;
    }

    /* ==============================
       MAIN MENU
    ============================== */

    #menuPagina {
      display: block;
    }

    main {
      max-width: 1250px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 23px;
    }

    .intro h1 {
      margin: 0 0 7px;
      font-size: 31px;
      letter-spacing: -.8px;
    }

    .intro p {
      margin: 0;
      color: #9999a3;
      font-size: 15px;
    }

    #aantal {
      color: #9999a3;
      font-size: 14px;
      white-space: nowrap;
    }

    /* ==============================
       GAME GRID
    ============================== */

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .game {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
      min-width: 0;
    }

    .kaart {
      overflow: hidden;
      border-radius: 16px;
      background: #1c1c20;
      border: 1px solid #29292e;
      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .game:hover .kaart {
      transform: translateY(-5px);
      border-color: #4a4a52;
      box-shadow: 0 14px 35px rgba(0, 0, 0, .4);
    }

    .game:active .kaart {
      transform: translateY(-2px) scale(.99);
    }

    .game-afbeelding {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #29292e;
    }

    .game-info {
      padding: 13px 14px 15px;
    }

    .game-naam {
      display: block;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-sub {
      margin-top: 5px;
      color: #8f8f98;
      font-size: 12px;
    }

    /* ==============================
       GEEN RESULTATEN
    ============================== */

    .geen-resultaat {
      display: none;
      text-align: center;
      padding: 90px 20px;
      color: #9999a3;
    }

    .geen-resultaat strong {
      display: block;
      color: white;
      font-size: 22px;
      margin-bottom: 8px;
    }

    /* ==============================
       GAME PAGINA
    ============================== */

    #gamePagina {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #080809;
    }

    .game-header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 15px;
      background: #151518;
      border-bottom: 1px solid #29292d;
    }

    .game-header-links {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .terug-knop,
    .fullscreen-knop {
      border: 0;
      cursor: pointer;
      color: white;
      background: #2a2a2f;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 14px;
      transition: .15s ease;
    }

    .terug-knop:hover,
    .fullscreen-knop:hover {
      background: #3a3a41;
    }

    .game-header-titel {
      font-size: 17px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-venster {
      position: absolute;
      top: 64px;
      right: 0;
      bottom: 0;
      left: 0;
      background: #000;
    }

    #gameFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    /* ==============================
       LAADSCHERM
    ============================== */

    .game-loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #000;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .game-loading.hidden {
      opacity: 0;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #333338;
      border-top-color: #ff4d6d;
      border-radius: 50%;
      animation: draaien .8s linear infinite;
    }

    @keyframes draaien {
      to {
        transform: rotate(360deg);
      }
    }

    .game-loading-text {
      color: #aaaab2;
      font-size: 14px;
    }

    /* ==============================
       ERROR
    ============================== */

    .game-error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #111114;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .game-error-inner {
      width: min(520px, 100%);
    }

    .game-error h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .game-error p {
      margin: 0 0 20px;
      color: #a1a1ab;
      line-height: 1.5;
    }

    .error-knop {
      display: inline-block;
      border: 0;
      border-radius: 12px;
      padding: 12px 17px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #ff4d6d;
      color: white;
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 800px) {
      .header-inner {
        padding: 14px 15px;
      }

      .topbar {
        display: block;
      }

      .logo {
        margin-bottom: 13px;
      }

      main {
        padding: 22px 15px 40px;
      }

      .games {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .intro h1 {
        font-size: 26px;
      }
    }

    @media (max-width: 600px) {
      .games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .game-header {
        height: 58px;
      }

      .game-venster {
        top: 58px;
      }

      .fullscreen-knop {
        padding: 10px 11px;
        font-size: 13px;
      }

      .terug-knop {
        padding: 10px 11px;
      }
    }

    @media (max-width: 390px) {
      .games {
        grid-template-columns: 1fr;
      }

      .intro {
        display: block;
      }

      #aantal {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================
       MENU
  =========================================== -->

  <div id="menuPagina">

    <header>
      <div class="header-inner">

        <div class="topbar">

          <div
            class="logo"
            onclick="naarMenu()"
            title="Terug naar FlintGames"
          >
            Flint<span>Games</span>
          </div>

          <div class="zoekbalk">
            <span class="zoek-icoon">⌕</span>

            <input
              id="zoekveld"
              type="search"
              placeholder="Zoek een game..."
              autocomplete="off"
            >
          </div>

        </div>

      </div>
    </header>

    <main>

      <div class="intro">

        <div>
          <h1>Alle games</h1>

          <p>
            Kies een game om hem direct te spelen.
          </p>
        </div>

        <div id="aantal"></div>

      </div>

      <div
        class="games"
        id="gamesContainer"
      ></div>

      <div
        class="geen-resultaat"
        id="geenResultaat"
      >
        <strong>Geen games gevonden</strong>
        Probeer een andere zoekterm.
      </div>

    </main>

  </div>


  <!-- ==========================================
       GAME SPELER
  =========================================== -->

  <div id="gamePagina">

    <div class="game-header">

      <div class="game-header-links">

        <button
          class="terug-knop"
          onclick="naarMenu()"
        >
          ← Terug
        </button>

        <div
          class="game-header-titel"
          id="gameTitel"
        >
          Game
        </div>

      </div>

      <button
        class="fullscreen-knop"
        onclick="maakFullscreen()"
      >
        ⛶ Fullscreen
      </button>

    </div>


    <div class="game-venster">

      <div
        class="game-loading"
        id="gameLoading"
      >

        <div class="spinner"></div>

        <div class="game-loading-text">
          Game laden...
        </div>

      </div>


      <div
        class="game-error"
        id="gameError"
      >

        <div class="game-error-inner">

          <h2>Game kon niet worden geladen</h2>

          <p>
            Deze website staat mogelijk niet toe dat hij
            binnen FlintGames wordt weergegeven.
          </p>

          <button
            class="error-knop"
            onclick="openExtern()"
          >
            Open game apart
          </button>

        </div>

      </div>


      <iframe
        id="gameFrame"
        title="FlintGames"
        allow="
          autoplay;
          fullscreen;
          gamepad;
          accelerometer;
          gyroscope;
          microphone;
          camera
        "
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

    </div>

  </div>


  <script>
    /*
    ==================================================
    GAMES
    ==================================================

    Voeg hieronder gemakkelijk nieuwe games toe.

    naam       = naam van de game
    url        = URL van de game
    afbeelding = afbeelding van de game

    Voorbeeld:

    {
      naam: "Mijn game",
      url: "https://jouwwebsite.nl/game/",
      afbeelding: "https://jouwwebsite.nl/foto.jpg"
    }

    ==================================================
    */

    const links = [

      {
        naam: "René Le Blanc: Schreeuw",
        url: "https://trickortrust.github.io/reneleblancschreeuw/",
        afbeelding:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHRk5ZHSRXjdzUgEjGcI7J_keE4eD6h7vSeFzKEVrRyw&s=10"
      },

      {
        naam: "René Le Blanc: Tropical Nights",
        url: "https://trickortrust.github.io/tropicalnights/",
        afbeelding:
          "https://via.placeholder.com/640x400/25252b/ffffff?text=René+Le+Blanc"
      },

      {
        naam: "Aapje Simulator: Compilcated",
        url: "https://trickortrust.github.io/aapje-simulator-complicated/",
        afbeelding:
          "https://via.placeholder.com/640x400/25252b/ffffff?text=Aapje+Simulator"
      },

      {
        naam: "Kiss, Marry, Kill",
        url: "https://trickortrust.github.io/kissmarrykill/",
        afbeelding:
          "https://via.placeholder.com/640x400/25252b/ffffff?text=Kiss+Marry+Kill"
      },

      {
        naam: "Aapje Simulator: Simplyfied",
        url: "https://trickortrust.github.io/aapje-simulator/",
        afbeelding:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHzOO0sYawuzGxHROPWHn9t1j_OplS9XFLfW6wokN9OA&s=10"
      },

      {
        naam: "Trick or Trust",
        url: "https://trickortrust.github.io/Trick-or-Trust/",
        afbeelding:
          "https://i.ytimg.com/vi/UuonG8Qy3kg/maxresdefault.jpg"
      },

      {
        naam: "Trick or Trust: Original version",
        url: "https://trickortrust.github.io/Trick-or-trust-originalversion/",
        afbeelding:
          "https://via.placeholder.com/640x400/25252b/ffffff?text=Trick+or+Trust"
      },

      {
        naam: "Flintiseenbaddy.com",
        url: "https://sites.google.com/martinuscollege.nl/flintiseenbaddiecom/homepage",
        afbeelding:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStQ78YTqqIzvty2y1SOCDSfPMxrwQV6bv_D3MOD3K5JQ&s=10"
      },

      {
        naam: "Kleurkiezer",
        url: "https://trickortrust.github.io/kleurkiezer/",
        afbeelding:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTY1rrFz7sv7Be1hzucO6krTFTT8TofeLfr3QvLdbzqAg&s=10"
      },

      {
        naam: "Ragdoll Stickman",
        url: "https://trickortrust.github.io/ragdollstickman/",
        afbeelding:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQa7K4Rv-YJDKE_VajyOsWmIxGzG5OOC22xgl3CDg-yg&s=10"
      },

      {
        naam: "Meldingmaker",
        url: "https://trickortrust.github.io/meldingmaker/",
        afbeelding:
          "https://via.placeholder.com/640x400/25252b/ffffff?text=Meldingmaker"
      }

    ];


    /*
    ==================================================
       ELEMENTEN
    ==================================================
    */

    const menuPagina =
      document.getElementById("menuPagina");

    const gamePagina =
      document.getElementById("gamePagina");

    const container =
      document.getElementById("gamesContainer");

    const zoekveld =
      document.getElementById("zoekveld");

    const aantal =
      document.getElementById("aantal");

    const geenResultaat =
      document.getElementById("geenResultaat");

    const gameFrame =
      document.getElementById("gameFrame");

    const gameTitel =
      document.getElementById("gameTitel");

    const gameLoading =
      document.getElementById("gameLoading");

    const gameError =
      document.getElementById("gameError");


    let huidigeGame = null;


    /*
    ==================================================
       SHUFFLE
    ==================================================
    */

    function schud(array) {

      const kopie = [...array];

      for (
        let i = kopie.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [
          kopie[i],
          kopie[j]
        ] = [
          kopie[j],
          kopie[i]
        ];

      }

      return kopie;
    }


    const willekeurigeLinks =
      schud(links);


    /*
    ==================================================
       GAMES TONEN
    ==================================================
    */

    function toonGames(lijst) {

      container.innerHTML = "";

      aantal.textContent =
        lijst.length +
        (lijst.length === 1
          ? " game"
          : " games");


      if (lijst.length === 0) {

        geenResultaat.style.display =
          "block";

        return;
      }


      geenResultaat.style.display =
        "none";


      lijst.forEach((link) => {

        const knop =
          document.createElement("button");

        knop.className =
          "game";


        knop.setAttribute(
          "type",
          "button"
        );


        knop.innerHTML = `

          <div class="kaart">

            <img
              class="game-afbeelding"
              src="${escapeAttribute(link.afbeelding)}"
              alt=""
              loading="lazy"
              onerror="
                this.src='https://via.placeholder.com/640x400/25252b/ffffff?text=FlintGames'
              "
            >

            <div class="game-info">

              <span class="game-naam">
                ${escapeHTML(link.naam)}
              </span>

              <div class="game-sub">
                Klik om te spelen
              </div>

            </div>

          </div>

        `;


        knop.addEventListener(
          "click",
          function() {

            openGame(link);

          }
        );


        container.appendChild(knop);

      });

    }


    /*
    ==================================================
       GAME OPENEN
    ==================================================
    */

    function openGame(game) {

      huidigeGame = game;


      gameTitel.textContent =
        game.naam;


      menuPagina.style.display =
        "none";


      gamePagina.style.display =
        "block";


      document.body.style.overflow =
        "hidden";


      gameError.style.display =
        "none";


      gameLoading.classList.remove(
        "hidden"
      );


      gameFrame.src =
        "about:blank";


      setTimeout(function() {

        gameFrame.src =
          game.url;

      }, 50);

    }


    /*
    ==================================================
       IFRAME GELADEN
    ==================================================
    */

    gameFrame.addEventListener(
      "load",
      function() {

        gameLoading.classList.add(
          "hidden"
        );

      }
    );


    /*
    ==================================================
       TERUG NAAR MENU
    ==================================================
    */

    function naarMenu() {

      gamePagina.style.display =
        "none";


      menuPagina.style.display =
        "block";


      document.body.style.overflow =
        "";


      gameFrame.src =
        "about:blank";


      huidigeGame =
        null;

    }


    /*
    ==================================================
       VOLLEDIG SCHERM
    ==================================================
    */

    function maakFullscreen() {

      const element =
        gamePagina;


      if (
        document.fullscreenElement
      ) {

        if (
          document.exitFullscreen
        ) {

          document.exitFullscreen();

        }

        return;
      }


      if (
        element.requestFullscreen
      ) {

        element.requestFullscreen();

      }

    }


    /*
    ==================================================
       EXTERNE GAME OPENEN
    ==================================================
    */

    function openExtern() {

      if (
        huidigeGame &&
        huidigeGame.url
      ) {

        window.open(
          huidigeGame.url,
          "_blank",
          "noopener,noreferrer"
        );

      }

    }


    /*
    ==================================================
       ZOEKEN
    ==================================================
    */

    zoekveld.addEventListener(
      "input",
      function() {

        const zoekterm =
          this.value
            .trim()
            .toLowerCase();


        const resultaten =
          willekeurigeLinks.filter(
            function(link) {

              return link.naam
                .toLowerCase()
                .includes(zoekterm);

            }
          );


        toonGames(resultaten);

      }
    );


    /*
    ==================================================
       ESCAPE
    ==================================================
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          gamePagina.style.display === "block"
        ) {

          naarMenu();

        }

      }
    );


    /*
    ==================================================
       HTML VEILIG MAKEN
    ==================================================
    */

    function escapeHTML(tekst) {

      return String(tekst)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function escapeAttribute(tekst) {

      return escapeHTML(tekst);

    }


    /*
    ==================================================
       START
    ==================================================
    */

    toonGames(
      willekeurigeLinks
    );

  </script>

</body>
</html>
