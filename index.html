<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina buiten gebruik</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;

        /* Diagonale zwarte en grijze strepen */
        background:
            repeating-linear-gradient(
                -45deg,
                #111 0px,
                #111 25px,
                #333 25px,
                #333 50px
            );
    }

    .warning {
        width: min(520px, calc(100% - 40px));
        padding: 38px 40px;
        background: #fff;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .warning-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #111;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: bold;
    }

    h1 {
        margin: 0 0 14px;
        color: #111;
        font-size: 30px;
        line-height: 1.2;
    }

    p {
        margin: 0 0 25px;
        color: #555;
        font-size: 16px;
        line-height: 1.5;
    }

    .visit-button {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 11px;
        background: #111;
        color: white;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .visit-button:hover {
        background: #333;
        transform: translateY(-2px);
    }

    .external-icon {
        font-size: 19px;
        line-height: 1;
    }

    @media (max-width: 500px) {
        .warning {
            padding: 30px 25px;
        }

        h1 {
            font-size: 25px;
        }

        p {
            font-size: 15px;
        }
    }
</style>
</head>

<body>

<div class="warning">

    <div class="warning-icon">!</div>

    <h1>Deze pagina is buiten gebruik</h1>

    <p>
        Flint heeft de domeinnaam aangepast.<br>
        Bezoek de nieuwe hieronder:
    </p>

    <!-- VERVANG DE URL HIERONDER -->
    <a class="visit-button"
       href="https://flintbruijn.github.io/flintgames"
       target="_blank"
       rel="noopener noreferrer">

        <span>Bezoeken</span>
        <span class="external-icon">↗</span>

    </a>

</div>

</body>
</html>
